<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" font-family="Nunito,Arial,sans-serif" font-size="14" fill="#1B2333">
<title>Solution architecture</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#444"/></marker>
<style>.b{fill:#EEF3FA;stroke:#2B6CB0;stroke-width:1.6}.t{fill:#FFF4D6;stroke:#C08A00;stroke-width:1.6}.g{fill:#E9F7EF;stroke:#1E8449;stroke-width:1.6}.r{fill:#FDE2DD;stroke:#C0392B;stroke-width:1.6}.l{stroke:#444;stroke-width:1.6;fill:none;marker-end:url(#a)}.c{text-anchor:middle}.h{font-size:18px;font-weight:800;fill:#2B6CB0}.s{font-size:12px;fill:#555}</style></defs>
<rect width="1100" height="600" fill="#fff"/>
<text x="20" y="34" class="h">Stage 1 · categorise every expense</text>
<rect class="b" x="20" y="110" width="150" height="90" rx="12"/><text class="c" x="95" y="145">Bank SMS</text><text class="c" x="95" y="166">ADCB · Liv · Mashreq</text><text class="c" x="95" y="185">FAB · ADIB</text>
<rect class="b" x="205" y="110" width="150" height="90" rx="12"/><text class="c" x="280" y="145">Parse</text><text class="c" x="280" y="166">bank-specific regex:</text><text class="c" x="280" y="185">amount, merchant, date</text>
<rect class="b" x="390" y="110" width="150" height="90" rx="12"/><text class="c" x="465" y="145">Clean</text><text class="c" x="465" y="166">expenses only, de-dup,</text><text class="c" x="465" y="185">AED, brand table</text>
<path class="l" d="M170 155H203"/><path class="l" d="M355 155H388"/><path class="l" d="M540 155H578"/>
<rect x="580" y="50" width="290" height="330" rx="16" fill="#FFFDF5" stroke="#C08A00" stroke-width="2"/>
<text class="c" x="725" y="78" font-weight="800" fill="#8a6100">Categorisation cascade</text>
<rect class="t" x="610" y="95" width="230" height="40" rx="10"/><text class="c" x="725" y="120">1 · Lookup (known merchant)</text>
<rect class="t" x="610" y="155" width="230" height="40" rx="10"/><text class="c" x="725" y="180">2 · Brand and keyword rules</text>
<rect class="t" x="610" y="215" width="230" height="40" rx="10"/><text class="c" x="725" y="240">3 · Calibrated TF-IDF + LR</text>
<rect class="t" x="610" y="275" width="230" height="40" rx="10" stroke-dasharray="6 4"/><text class="c" x="725" y="300">4 · LLM / fine-tuned encoder*</text>
<rect class="r" x="610" y="330" width="230" height="38" rx="10"/><text class="c" x="725" y="354">Flag for user review</text>
<path class="l" d="M725 135V153"/><path class="l" d="M725 195V213"/><path class="l" d="M725 255V273"/><path class="l" d="M725 315V328"/>
<path class="l" d="M600 350V120H606" stroke-dasharray="4 4"/><text class="s" x="594" y="240" text-anchor="end">answer saved</text><text class="s" x="594" y="256" text-anchor="end">to lookup</text>
<text class="s c" x="725" y="400" font-style="italic">each tier runs only if the previous one is below the confidence threshold</text>
<rect class="g" x="920" y="170" width="160" height="100" rx="12"/><text class="c" x="1000" y="205">SQLite table</text><text class="c" x="1000" y="226">expenses with</text><text class="c" x="1000" y="247">category + confidence</text>
<path class="l" d="M870 220H918"/>
<text x="20" y="440" class="h">Stage 2 · answer questions</text>
<rect class="b" x="20" y="470" width="190" height="90" rx="12"/><text class="c" x="115" y="503">Question</text><text class="c" x="115" y="524">"How much did I spend</text><text class="c" x="115" y="543">on food in May?"</text>
<rect class="b" x="240" y="470" width="190" height="90" rx="12"/><text class="c" x="335" y="503">Local LLM</text><text class="c" x="335" y="524">(Qwen2.5-Instruct)</text><text class="c" x="335" y="543">writes one SQL query</text>
<rect class="b" x="460" y="470" width="190" height="90" rx="12"/><text class="c" x="555" y="503">Guard</text><text class="c" x="555" y="524">single read-only SELECT,</text><text class="c" x="555" y="543">time limit</text>
<rect class="b" x="680" y="470" width="190" height="90" rx="12"/><text class="c" x="775" y="514">Run on a read-only</text><text class="c" x="775" y="535">copy of the table</text>
<rect class="g" x="900" y="470" width="180" height="90" rx="12"/><text class="c" x="990" y="503">Answer</text><text class="c" x="990" y="524">numbers copied from</text><text class="c" x="990" y="543">the query result</text>
<path class="l" d="M210 515H238"/><path class="l" d="M430 515H458"/><path class="l" d="M650 515H678"/><path class="l" d="M870 515H898"/>
<path class="l" d="M1000 270L780 468"/><text class="s" x="905" y="380">query</text>
<text class="s" x="1080" y="590" text-anchor="end">* proposed next stage, not yet built</text>
</svg>
